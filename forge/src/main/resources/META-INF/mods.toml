[[mods]]
modId="jinzai_traffic_lights"
version="${version}"
displayName="津仔的交通灯"
authors="Crzay津仔"
logoFile="icon.png"
displayTest="MATCH_VERSION"
description='''
JINZAI Traffic Lights is a Minecraft 1.20.1 decorative expansion mod for city building, available for Fabric and Forge through a shared Architectury codebase. Version 2.0.33 retains all 103 phase-one blocks and all 58 phase-two models, for 161 freely combinable blocks in total: 48 traffic-light frame and frame-component blocks, 55 static indicator and decorative lighting blocks, 48 pole and pole-component blocks, and 10 illuminated, pass-through traffic-light accessory decorations. Ten complex traffic-light models use one enclosing box matching each complete placed model volume for their selection and physical collision; the other 151 blocks retain their previous collision behavior. The 10 accessory blocks appear in their own creative-mode tab named Traffic Light Accessories; all other additions remain in the existing category tabs. Dynamic traffic lights, countdowns, automatic cycling and customizable signal control are not included. Art and funding by Crzay津仔; technical implementation and production by QiZhang. Copyright in the art assets belongs to "Crzay津仔"; copyright in the mod code and configuration belongs to "QiZhang".

津仔的交通灯是一个适用于 Minecraft 1.20.1 的城建装饰扩展模组，通过共享的 Architectury 代码同时提供 Fabric 与 Forge 版本。2.0.33 版本完整保留一期103个方块和二期新增的58个模型，共有161个可自由搭配的方块：48个红绿灯框架与框架部件、55个静态指示灯与照明装饰、48个杆子与杆件部件，以及10个发光且可穿透的交通灯附属装饰。10个复杂红绿灯模型分别使用1个贴合完整放置模型体积的选择与物理碰撞外包箱，其余151个方块保持原有碰撞行为。10个附属方块单独收录在名为“交通灯附属”的创造模式标签页中，其余新增方块继续归入原有分类标签页。当前不包含动态红绿灯、倒计时、自动切灯或自定义交通信号控制。Crzay津仔提供美术与资金支持，QiZhang提供技术实现与制作。美术素材版权归 "Crzay津仔"所有，模组代码/配置版权归"QiZhang"所有。
'''

[[dependencies.jinzai_traffic_lights]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.jinzai_traffic_lights]]
